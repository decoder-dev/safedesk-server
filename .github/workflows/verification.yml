name: Verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    name: Server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Rust and protocol compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - name: Install Rust and protocol compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          choco install protoc -y --no-progress
      - run: cargo test --workspace --locked
  web-ui:
    name: Web UI production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/html
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/html/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
  windows-ui:
    name: Windows GUI build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: ui/html
      - run: npm run build
        working-directory: ui/html
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable build --locked --release
        working-directory: ui
